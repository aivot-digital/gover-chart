apiVersion: apps/v1
kind: Deployment
metadata:
    name: puppet-deployment
    labels:
        app: puppet
spec:
    replicas: 1
    selector:
        matchLabels:
            app: puppet
    template:
        metadata:
            labels:
                app: puppet
        spec:
            containers:
                -   name: puppet
                    image: ghcr.io/aivot-digital/puppet-pdf:2.0.0
                    resources:
                        requests:
                            cpu: 250m
                            memory: 128Mi
                        limits:
                            cpu: 500m
                            memory: 256Mi
                    ports:
                        -   containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
    name: puppet-service
    labels:
        app: puppet-service
spec:
    selector:
        app: puppet
    ports:
        -   protocol: TCP
            port: 3000
