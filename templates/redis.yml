apiVersion: apps/v1
kind: Deployment
metadata:
    name: redis-deployment
    labels:
        app: redis
spec:
    replicas: 1
    selector:
        matchLabels:
            app: redis
    template:
        metadata:
            labels:
                app: redis
        spec:
            containers:
                -   name: redis
                    image: redis:7.2.5
                    resources:
                        requests:
                            cpu: 50m
                            memory: 32Mi
                        limits:
                            cpu: 100m
                            memory: 64Mi
                    ports:
                        -   containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
    name: redis-service
    labels:
        app: redis-service
spec:
    selector:
        app: redis
    ports:
        -   protocol: TCP
            port: 6379